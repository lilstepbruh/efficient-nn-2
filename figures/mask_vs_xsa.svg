<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#2563EB"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#10B981"/></marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#EF4444"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F8FAFC"/>

  <rect x="70" y="70" width="650" height="760" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" filter="url(#shadow)"/>
  <rect x="880" y="70" width="650" height="760" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" filter="url(#shadow)"/>

  <text x="395" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">МАСКА ДИАГОНАЛИ</text>
  <text x="1205" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">XSA</text>

  <!-- attention matrix -->
  <text x="395" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#64748B">Матрица весов attention</text>
  <g transform="translate(190 250)">
    <rect width="410" height="410" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>
    <!-- causal lower triangle cells -->
    <g fill="#93C5FD">
      <rect x="10" y="10" width="55" height="55" rx="5"/>
      <rect x="10" y="77" width="55" height="55" rx="5"/><rect x="77" y="77" width="55" height="55" rx="5"/>
      <rect x="10" y="144" width="55" height="55" rx="5"/><rect x="77" y="144" width="55" height="55" rx="5"/><rect x="144" y="144" width="55" height="55" rx="5"/>
      <rect x="10" y="211" width="55" height="55" rx="5"/><rect x="77" y="211" width="55" height="55" rx="5"/><rect x="144" y="211" width="55" height="55" rx="5"/><rect x="211" y="211" width="55" height="55" rx="5"/>
      <rect x="10" y="278" width="55" height="55" rx="5"/><rect x="77" y="278" width="55" height="55" rx="5"/><rect x="144" y="278" width="55" height="55" rx="5"/><rect x="211" y="278" width="55" height="55" rx="5"/><rect x="278" y="278" width="55" height="55" rx="5"/>
      <rect x="10" y="345" width="55" height="55" rx="5"/><rect x="77" y="345" width="55" height="55" rx="5"/><rect x="144" y="345" width="55" height="55" rx="5"/><rect x="211" y="345" width="55" height="55" rx="5"/><rect x="278" y="345" width="55" height="55" rx="5"/><rect x="345" y="345" width="55" height="55" rx="5"/>
    </g>
    <!-- diagonal crosses -->
    <g stroke="#EF4444" stroke-width="9" stroke-linecap="round">
      <path d="M20 20L55 55M55 20L20 55"/><path d="M87 87L122 122M122 87L87 122"/>
      <path d="M154 154L189 189M189 154L154 189"/><path d="M221 221L256 256M256 221L221 256"/>
      <path d="M288 288L323 323M323 288L288 323"/><path d="M355 355L390 390M390 355L355 390"/>
    </g>
  </g>
  <text x="395" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2563EB">Меняет веса attention</text>
  <text x="395" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#475569">Собственная позиция исключается,</text>
  <text x="395" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#475569">остальные веса пересчитываются</text>

  <!-- XSA vector projection -->
  <text x="1205" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#64748B">Выход одной attention-головы</text>
  <circle cx="1010" cy="630" r="7" fill="#0F172A"/>
  <line x1="1010" y1="630" x2="1415" y2="630" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>
  <text x="1435" y="642" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#64748B">V</text>
  <line x1="1010" y1="630" x2="1315" y2="300" stroke="#2563EB" stroke-width="11" stroke-linecap="round" marker-end="url(#blue)"/>
  <text x="1340" y="310" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2563EB">Y</text>
  <line x1="1020" y1="630" x2="1305" y2="630" stroke="#EF4444" stroke-width="13" stroke-linecap="round" marker-end="url(#red)" opacity="0.85"/>
  <text x="1160" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#EF4444">удаляемая компонента</text>
  <line x1="1315" y1="620" x2="1315" y2="315" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 13" marker-end="url(#green)"/>
  <text x="1335" y="480" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#10B981">Z</text>
  <path d="M1315 588H1275V630" fill="none" stroke="#475569" stroke-width="4"/>
  <text x="1205" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#10B981">Меняет выходной вектор</text>
  <text x="1205" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#475569">Веса сохраняются, компонент вдоль V</text>
  <text x="1205" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#475569">удаляется после смешивания</text>

  <!-- not equal sign -->
  <circle cx="800" cy="450" r="62" fill="#0F172A"/>
  <text x="800" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">≠</text>
</svg>
